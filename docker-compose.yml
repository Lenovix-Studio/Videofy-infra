name: videofy

services:
  postgres-dev:
    image: postgres:17-alpine
    container_name: videofy-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: videofy
      POSTGRES_USER: videofy
      POSTGRES_PASSWORD: videofy

    ports:
      - "6030:5432"

    volumes:
      - ./data/postgres-dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videofy -d videofy"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - videofy-network

  postgres-prod:
    image: postgres:17-alpine
    container_name: videofy-prod
    restart: unless-stopped

    environment:
      POSTGRES_DB: videofy
      POSTGRES_USER: videofy
      POSTGRES_PASSWORD: videofy

    ports:
      - "6031:5432"

    volumes:
      - ./data/postgres-prod:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videofy -d videofy"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - videofy-network

  redis-dev:
    image: redis:7-alpine
    container_name: videofy-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videofy-network

  redis-prod:
    image: redis:7-alpine
    container_name: videofy-redis-prod
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis-prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videofy-network

networks:
  videofy-network:
    driver: bridge
